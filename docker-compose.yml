services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: abdinara_lms_app
    working_dir: /var/www/html
    # ---------------------------------------------------------------
    # TIDAK ADA volume mount dari Windows!
    # Semua code sudah di-COPY ke dalam image saat docker build.
    # Perubahan code -> perlu: docker compose build app && docker compose up -d
    # ---------------------------------------------------------------
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      OCTANE_SERVER: roadrunner
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: abdinara_lms_2
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: file
    depends_on:
      mysql:
        condition: service_healthy
    command: sh ./docker-entrypoint.sh

  mysql:
    image: mysql:8.4
    container_name: abdinara_lms_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: abdinara_lms_2
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot" ]
      interval: 5s
      timeout: 5s
      retries: 20

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: abdinara_lms_cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - app

volumes:
  mysql_data:
